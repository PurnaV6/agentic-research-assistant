name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v
        # No GROQ_API_KEY is set here on purpose: every test mocks the LLM
        # client and network calls, so the suite never needs a real key.

      - name: Build Docker image
        run: docker build -t agentic-research-assistant:ci .
